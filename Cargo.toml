[workspace.package]
version = "0.5.1"
edition = "2024"
description = "GuestJS is a Rust library for executing guest JavaScript code transparently."
repository = "https://github.com/wizrds/guestjs"
license = "ISC"
readme = "README.md"
rust-version = "1.99"

[workspace]
resolver = "2"
members = [
    "crates/guestjs-macros",
    "crates/guestjs-core",
    "crates/guestjs-quickjs",
    "crates/guestjs",
]
exclude = [
    "crates/guestjs-test",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

async-trait = { version = "0.1" }
tokio = { version = "1" }
futures = { version = "0.3" }

thiserror = { version = "2" }

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
