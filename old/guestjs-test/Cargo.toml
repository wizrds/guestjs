[package]
name = "guestjs-test"
version = "0.0.0"
edition = "2024"
description = ""
repository = "https://github.com/wizrds/guestjs"
license = "ISC"
readme = "README.md"

[[bin]]
name = "guestjs-test"
path = "src/main.rs"

[dependencies]
guestjs = { path = "../guestjs" }

anyhow = { version = "1" }

async-trait = { version = "0.1" }
futures = { version = "0.3" }

tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
default = ["typescript"]
typescript = ["guestjs/typescript"]
