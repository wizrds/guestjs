[package]
name = "guestjs-quickjs"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
guestjs-core = { path = "../guestjs-core", version = "0.6.0", default-features = false }

futures = { workspace = true }

thiserror = { workspace = true }

rquickjs = { version = "0.14.0", features = ["full-async"] }
rquickjs-serde = { version = "0.8" }

llrt_modules = { git = "https://github.com/awslabs/llrt", rev = "d2ae1d9", default-features = false, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[features]
default = []
llrt = ["dep:llrt_modules"]
llrt-abort = ["llrt", "llrt_modules/abort"]
llrt-buffer = ["llrt", "llrt_modules/buffer"]
llrt-console = ["llrt", "llrt_modules/console"]
llrt-fetch = [
    "llrt",
    "llrt-abort",
    "llrt-buffer",
    "llrt-stream-web",
    "llrt-url",
    "llrt_modules/fetch",
    "llrt_modules/tls-ring",
]
llrt-fs = ["llrt", "llrt-buffer", "llrt_modules/fs"]
llrt-os = ["llrt", "llrt_modules/os"]
llrt-path = ["llrt", "llrt_modules/path"]
llrt-stream-web = ["llrt", "llrt_modules/stream-web"]
llrt-timers = ["llrt", "llrt_modules/timers"]
llrt-url = ["llrt", "llrt_modules/url"]

