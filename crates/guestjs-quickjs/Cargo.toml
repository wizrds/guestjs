[package]
name = "guestjs-quickjs"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
guestjs-core = { path = "../guestjs-core", version = "0.5.1", default-features = false }

futures = { workspace = true }

thiserror = { workspace = true }

rquickjs = { version = "0.14.0", features = ["full-async"] }
rquickjs-serde = { version = "0.8" }

llrt_modules = { git = "https://github.com/awslabs/llrt", rev = "d2ae1d9", default-features = false, features = ["path", "timers"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[features]
default = []
llrt = ["dep:llrt_modules"]
llrt-buffer = ["llrt", "llrt_modules/buffer"]
llrt-console = ["llrt", "llrt_modules/console"]
llrt-fetch = [
    "llrt",
    "llrt_modules/abort",
    "llrt_modules/buffer",
    "llrt_modules/fetch",
    "llrt_modules/stream-web",
    "llrt_modules/tls-ring",
    "llrt_modules/url",
]
llrt-fs = ["llrt", "llrt_modules/buffer", "llrt_modules/fs"]
llrt-os = ["llrt", "llrt_modules/os"]
llrt-url = ["llrt", "llrt_modules/url"]

