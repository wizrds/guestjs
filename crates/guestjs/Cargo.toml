[package]
name = "guestjs"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
guestjs-macros = { path = "../guestjs-macros", version = "0.5.1", default-features = false }
guestjs-core = { path = "../guestjs-core", version = "0.5.1", default-features = false }
guestjs-quickjs = { path = "../guestjs-quickjs", version = "0.5.1", default-features = false, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
quickjs = ["dep:guestjs-quickjs"]
