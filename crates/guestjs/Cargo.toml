[package]
name = "guestjs"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
guestjs-macros = { path = "../guestjs-macros", version = "0.6.1", default-features = false }
guestjs-core = { path = "../guestjs-core", version = "0.6.1", default-features = false }
guestjs-quickjs = { path = "../guestjs-quickjs", version = "0.6.1", default-features = false, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
bytes = ["guestjs-core/bytes"]
embedded = ["guestjs-core/embedded"]
tokio = ["guestjs-core/tokio"]
quickjs = ["dep:guestjs-quickjs"]
llrt = ["quickjs", "guestjs-quickjs/llrt"]
llrt-abort = ["quickjs", "guestjs-quickjs/llrt-abort"]
llrt-buffer = ["quickjs", "guestjs-quickjs/llrt-buffer"]
llrt-console = ["quickjs", "guestjs-quickjs/llrt-console"]
llrt-fetch = ["quickjs", "guestjs-quickjs/llrt-fetch"]
llrt-fs = ["quickjs", "guestjs-quickjs/llrt-fs"]
llrt-os = ["quickjs", "guestjs-quickjs/llrt-os"]
llrt-path = ["quickjs", "guestjs-quickjs/llrt-path"]
llrt-stream-web = ["quickjs", "guestjs-quickjs/llrt-stream-web"]
llrt-timers = ["quickjs", "guestjs-quickjs/llrt-timers"]
llrt-url = ["quickjs", "guestjs-quickjs/llrt-url"]
serde = ["guestjs-core/serde", "guestjs-macros/serde"]
